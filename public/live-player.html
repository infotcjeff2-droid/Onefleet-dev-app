<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>808GPS 即時影像播放器</title>
  <!-- FLV.js（僅用於 FLV 協議） -->
  <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
  <!-- HLS.js（用於 HLS 協議；Safari 原生支援可略過） -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0f0f1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    #video-container {
      width: 100%;
      max-width: 800px;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      display: block;
      background-color: #000;
    }
    #status {
      margin-top: 20px;
      padding: 15px 20px;
      background-color: #1a1a2e;
      border-radius: 8px;
      text-align: center;
      max-width: 800px;
      width: 100%;
    }
    #status.success { border-left: 4px solid #22C55E; }
    #status.error { border-left: 4px solid #EF4444; }
    #status.loading { border-left: 4px solid #F59E0B; }
    #status h3 { font-size: 16px; margin-bottom: 8px; }
    #status p { font-size: 14px; color: #9CA3AF; }
    .error-detail {
      margin-top: 10px;
      padding: 10px;
      background-color: rgba(239, 68, 68, 0.1);
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      text-align: left;
    }
    #debug-info {
      margin-top: 10px;
      padding: 10px;
      background-color: rgba(59, 130, 246, 0.05);
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #9CA3AF;
      word-break: break-all;
      text-align: left;
      max-height: 100px;
      overflow-y: auto;
    }
    #controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      max-width: 800px;
      width: 100%;
    }
    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.primary { background-color: #3B82F6; color: white; }
    button.primary:hover { background-color: #2563EB; }
    button.secondary { background-color: #374151; color: white; }
    button.secondary:hover { background-color: #4B5563; }
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #6B7280;
      text-align: center;
      max-width: 800px;
    }
    .info code {
      background-color: #1a1a2e;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" controls playsinline autoplay muted></video>
  </div>

  <div id="status" class="loading">
    <h3>連線中...</h3>
    <p>正在連接到串流伺服器</p>
  </div>

  <div id="debug-info"></div>

  <div id="controls">
    <button class="primary" id="btn-retry">重新連線</button>
    <button class="secondary" id="btn-fullscreen">全螢幕</button>
  </div>

  <p class="info">
    808GPS 即時影像播放器 | 支援 <code>HLS</code> 與 <code>HTTP-FLV</code> 串流
  </p>

  <script>
    // 從 URL 參數獲取串流資訊
    const urlParams = new URLSearchParams(window.location.search);
    const streamUrl = urlParams.get('url');
    const devIdno = urlParams.get('devIdno') || 'Unknown';
    const channel = urlParams.get('channel') || '0';
    const quality = urlParams.get('quality') || 'sd';
    // 從 URL 自動推斷協議（默認 hls）
    const protocol = (urlParams.get('protocol') ||
                     (streamUrl?.includes('.m3u8') ? 'hls' :
                      streamUrl?.includes('hls') ? 'hls' : 'hls')).toLowerCase();

    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const debugInfo = document.getElementById('debug-info');
    const btnRetry = document.getElementById('btn-retry');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    let player = null;       // flv.js instance
    let hlsInstance = null;  // hls.js instance
    let logs = [];

    function addLog(msg) {
      const time = new Date().toLocaleTimeString();
      logs.push(`[${time}] ${msg}`);
      if (logs.length > 20) logs.shift();
      debugInfo.innerHTML = logs.join('<br>');
      console.log(msg);
    }

    function updateStatus(type, title, message, detail) {
      status.className = type;
      let html = `<h3>${title}</h3><p>${message}</p>`;
      if (detail) {
        html += `<div class="error-detail">${detail}</div>`;
      }
      status.innerHTML = html;
    }

    function cleanup() {
      if (player) {
        try { player.destroy(); } catch (e) {}
        player = null;
      }
      if (hlsInstance) {
        try { hlsInstance.destroy(); } catch (e) {}
        hlsInstance = null;
      }
      video.removeAttribute('src');
      try { video.load(); } catch (e) {}
    }

    function initPlayer(url) {
      cleanup();

      addLog(`Initializing ${protocol.toUpperCase()} player: ${url.substring(0, 150)}...`);
      updateStatus('loading', '連線中...', `正在連接到 ${devIdno} CH${channel} (${protocol.toUpperCase()})`);

      // 先 HEAD 預檢：檢查後端是否回傳錯誤 JSON
      fetch(url, { method: 'HEAD' })
        .then(r => {
          const ct = r.headers.get('content-type') || '';
          addLog(`HEAD: ${r.status}, content-type: ${ct}`);
          // 如果不是 JSON 錯誤，繼續
          if (r.ok && !ct.includes('json')) return null;
          // 是 JSON 錯誤或失敗：抓 body
          return fetch(url).then(rr => rr.json()).catch(() => ({ error: r.statusText }));
        })
        .then(errData => {
          if (errData && errData.error) {
            addLog(`Backend error: ${JSON.stringify(errData).substring(0, 200)}`);
            let detail = `後端錯誤：${errData.error}`;
            if (errData.upstreamResponse) {
              try {
                detail += `\n\n上游回應：${JSON.stringify(JSON.parse(errData.upstreamResponse), null, 2)}`;
              } catch (e) {
                detail += `\n\n上游回應：${errData.upstreamResponse}`;
              }
            }
            updateStatus('error', '無法取得影像串流',
              errData.upstreamResponse?.includes('param') ? '需要登入 808GPS 或設備不支援影像' : '請檢查網路和設備狀態',
              detail);
            return;
          }
          if (protocol === 'hls') initHls(url);
          else if (protocol === 'flv') initFlv(url);
          else updateStatus('error', '未知協議', `protocol=${protocol}`, '請使用 hls 或 flv');
        })
        .catch(err => {
          addLog(`HEAD check failed: ${err.message}, trying anyway`);
          if (protocol === 'hls') initHls(url);
          else if (protocol === 'flv') initFlv(url);
        });
    }

    function initHls(url) {
      // Safari 原生支援 HLS
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        addLog('Using native HLS (Safari)');
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          addLog('Native HLS loaded');
          video.play().then(() => {
            updateStatus('success', '播放中', `${devIdno} CH${channel} - ${quality === 'hd' ? '高清' : '標清'}`);
          }).catch(err => {
            addLog(`Play rejected: ${err.message}`);
            updateStatus('loading', '等待點擊播放', '請點擊影片開始', err.message);
          });
        }, { once: true });
        video.addEventListener('error', () => {
          addLog(`Native HLS error: ${video.error?.message}`);
          updateStatus('error', '播放錯誤', 'HLS 載入失敗', video.error?.message || 'Unknown error');
        }, { once: true });
        return;
      }

      // 其他瀏覽器用 hls.js
      if (typeof Hls === 'undefined' || !Hls.isSupported()) {
        updateStatus('error', '瀏覽器不支援 HLS', '請使用 Safari 或支援 MSE 的瀏覽器', 'HLS.js not loaded or not supported');
        return;
      }

      hlsInstance = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30,
      });

      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(video);

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        addLog('HLS manifest parsed');
        video.play().then(() => {
          addLog('HLS playback started');
          updateStatus('success', '播放中', `${devIdno} CH${channel} - ${quality === 'hd' ? '高清' : '標清'}`);
        }).catch(err => {
          addLog(`HLS play rejected: ${err.message}`);
          updateStatus('loading', '等待點擊播放', '請點擊影片開始', err.message);
          video.addEventListener('click', function once() {
            video.play().then(() => {
              updateStatus('success', '播放中', `${devIdno} CH${channel}`);
            });
            video.removeEventListener('click', once);
          }, { once: true });
        });
      });

      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        addLog(`HLS error: ${data.type} - ${data.details}`);
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              hlsInstance.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              hlsInstance.recoverMediaError();
              break;
            default:
              updateStatus('error', 'HLS 播放錯誤',
                data.type,
                `${data.details}\n${data.error?.message || ''}`);
              return;
          }
        }
      });
    }

    function initFlv(url) {
      if (typeof flvjs === 'undefined') {
        updateStatus('error', 'flv.js 載入失敗', '請檢查網路連線', 'flv.js library not loaded');
        return;
      }
      if (!flvjs.isSupported()) {
        updateStatus('error', '不支援', '瀏覽器不支援 FLV 播放', '需要支援 MSE 的現代瀏覽器');
        return;
      }

      // 先 HEAD 檢查
      fetch(url, { method: 'HEAD' })
        .then(r => {
          addLog(`HEAD response: ${r.status}, content-type: ${r.headers.get('content-type')}`);
          if (!r.ok || r.headers.get('content-type')?.includes('json')) {
            return fetch(url).then(rr => rr.json()).catch(() => ({ error: r.statusText }));
          }
          return null;
        })
        .then(errData => {
          if (errData && errData.error) {
            addLog(`Backend error: ${JSON.stringify(errData)}`);
            let detail = `後端錯誤：${errData.error}`;
            if (errData.upstreamResponse) {
              try {
                detail += `\n\n上游回應：${JSON.stringify(JSON.parse(errData.upstreamResponse), null, 2)}`;
              } catch (e) {
                detail += `\n\n上游回應：${errData.upstreamResponse}`;
              }
            }
            updateStatus('error', '無法取得影像串流',
              errData.upstreamResponse?.includes('param error') ? '需要登入 808GPS 或設備不支援影像' : '請檢查網路和設備',
              detail);
            return;
          }
          startFlvPlayback(url);
        })
        .catch(err => {
          addLog(`Fetch error: ${err.message}`);
          startFlvPlayback(url);
        });
    }

    function startFlvPlayback(url) {
      try {
        player = flvjs.createPlayer({
          type: 'flv',
          url: url,
          isLive: true,
          hasAudio: true,
          hasVideo: true,
          cors: true,
          withCredentials: false,
        }, {
          enableWorker: false,
          enableStashBuffer: false,
          stashInitialSize: 128,
          autoCleanupSourceBuffer: true,
          autoCleanupMinBackwardDuration: 3,
          autoCleanupMaxBackwardDuration: 10,
        });

        player.attachMediaElement(video);

        player.on(flvjs.Events.MEDIA_INFO, (m) => {
          addLog(`FLV MEDIA_INFO: ${JSON.stringify(m).substring(0, 150)}`);
        });
        player.on(flvjs.Events.STATISTICS_DATA, (d) => {
          if (d && Math.random() < 0.05) {
            addLog(`FLV STATS: speed=${(d.speed || 0).toFixed(0)}B/s`);
          }
        });
        player.on(flvjs.Events.ERROR, (errType, errDetail, errInfo) => {
          addLog(`FLV ERROR: ${errType} - ${errDetail}`);
          let detail = `${errType}: ${errDetail}`;
          if (errInfo) detail += `\n\n${JSON.stringify(errInfo, null, 2)}`;
          let message = '播放錯誤';
          if (errType === 'NetworkError') message = '網路錯誤 - 無法載入串流';
          else if (errType === 'MediaError') {
            if (errDetail === 'FormatUnsupported') {
              message = '媒體格式不支援';
              detail = '伺服器回傳的不是有效的 FLV 串流。可能是：\n- 設備未登入 808GPS\n- 設備不支援影像功能\n- jsessionId 已過期';
            } else message = '媒體錯誤';
          }
          updateStatus('error', message, errDetail, detail);
        });

        player.load();
        player.play().then(() => {
          addLog('FLV playback started');
          updateStatus('success', '播放中', `${devIdno} CH${channel}`);
        }).catch(err => {
          addLog(`FLV play rejected: ${err.message}`);
          updateStatus('loading', '等待點擊播放', '請點擊影片開始', err.message);
          video.addEventListener('click', function once() {
            player?.play();
            video.removeEventListener('click', once);
          }, { once: true });
        });
      } catch (err) {
        addLog(`FLV init exception: ${err.message}`);
        updateStatus('error', '初始化失敗', err.message, err.stack);
      }
    }

    // 初始化
    if (streamUrl) {
      initPlayer(streamUrl);
    } else {
      updateStatus('error', '無串流 URL', '請提供 url 參數', '例如: live-player.html?url=...&protocol=hls');
    }

    btnRetry.addEventListener('click', () => {
      if (streamUrl) initPlayer(streamUrl);
    });

    btnFullscreen.addEventListener('click', () => {
      if (video.requestFullscreen) video.requestFullscreen();
      else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    });

    window.addEventListener('beforeunload', cleanup);
  </script>
</body>
</html>
